research_task:
  description: >
    Realiza una investigación exhaustiva sobre {topic}.
    
    Busca información actualizada utilizando fuentes confiables.
    Investiga:
    - Antecedentes y contexto
    - Información relevante
    - Datos importantes
    - Acontecimientos recientes
    - Diferentes perspectivas sobre el tema
    
    Contrasta la información encontrada y evita depender de una sola fuente.

  expected_output: >
    Un resumen estructurado de la investigación sobre {topic},
    incluyendo los hallazgos principales, datos importantes
    y las fuentes utilizadas.

  agent: researcher


reporting_task:
  description: >
    Utiliza la investigación realizada por el investigador para
    crear un reporte completo sobre {topic}.

    Organiza la información de forma clara y elimina información
    redundante o poco relevante.

  expected_output: >
    Un reporte en Markdown bien estructurado que incluya:
    introducción, hallazgos principales, análisis, conclusiones
    y fuentes consultadas.

  agent: reporting_analyst