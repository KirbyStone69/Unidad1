[project]
name = "sn"
version = "0.1.0"
description = "SN using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.22,<2.0.0"
]

[project.scripts]
sn = "sn.main:run"
run_crew = "sn.main:run"
train = "sn.main:train"
replay = "sn.main:replay"
test = "sn.main:test"
run_with_trigger = "sn.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "d27d80ed-3200-4b58-87b0-80a589085347"
